<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">

<title>小火 · 网页演示版 v0.1.12-web</title>
<style>
  html, body { margin: 0; height: 100%; }
  body {
    display: flex; align-items: center; justify-content: center;
    background: #f4f6f9; font-family: system-ui, "PingFang SC", "Microsoft YaHei", sans-serif;
    overflow: hidden;
  }
  #stage { background: transparent; display: block; }

  /* 顶部按钮栏（桌面版用，网页版隐藏） */
  #bar {
    position: fixed; top: 12px; left: 50%; transform: translateX(-50%);
    display: flex; gap: 8px; z-index: 10;
  }
  #bar button {
    border: 1px solid #d6d8dc; background: #fff; color: #2b2b2f;
    padding: 7px 14px; border-radius: 999px; font-size: 13px; cursor: pointer;
    box-shadow: 0 1px 3px rgba(0,0,0,.06);
  }
  #bar button:hover { background: #f0f1f3; }
  #status {
    position: fixed; top: 52px; left: 50%; transform: translateX(-50%);
    color: #6b7280; font-size: 12px; z-index: 10; letter-spacing: .3px;
  }
  .hint {
    position: fixed; bottom: 14px; left: 50%; transform: translateX(-50%);
    color: #6b7280; font-size: 12px; z-index: 10; letter-spacing: .3px; text-align: center;
  }

  /* 网页版动作控制面板（演示用，方便查看各种动作） */
  #ctrl {
    position: fixed; top: 12px; left: 50%; transform: translateX(-50%);
    display: flex; gap: 6px; flex-wrap: wrap; justify-content: center;
    z-index: 20; max-width: 96vw;
  }
  #ctrl button {
    border: 1px solid #d6d8dc; background: #fff; color: #2b2b2f;
    padding: 7px 12px; border-radius: 999px; font-size: 13px; cursor: pointer;
    box-shadow: 0 1px 3px rgba(0,0,0,.06);
  }
  #ctrl button:hover { background: #f0f1f3; }
  #ctrl span { color: #9aa0a6; font-size: 13px; align-self: center; }

  /* 全屏框选层（看屏/搜题）：截屏后铺满全屏让你框选 */
  #pickLayer {
    position: fixed; inset: 0; z-index: 30; cursor: crosshair; user-select: none;
    background: #000;
  }
  #pickImg {
    position: absolute; inset: 0; width: 100%; height: 100%; object-fit: fill;
    pointer-events: none;
  }
  #pickRect {
    position: absolute; border: 2px solid #ff5a5f; background: rgba(255,255,255,.12);
    display: none; pointer-events: none;
  }
  #pickHint {
    position: absolute; top: 24px; left: 50%; transform: translateX(-50%);
    color: #fff; font-size: 14px; opacity: .95; background: rgba(0,0,0,.45);
    padding: 6px 12px; border-radius: 8px; pointer-events: none;
  }

  /* 答案框 / 看屏结果框（共用样式） */
  .box {
    position: fixed; z-index: 40; max-width: 360px;
    background: rgba(28,28,32,.94); color: #f3f3f5;
    border: 1px solid #3a3a40; border-radius: 10px; padding: 12px 14px;
    font-size: 13px; line-height: 1.55; box-shadow: 0 6px 24px rgba(0,0,0,.3);
  }
  .box .close {
    position: absolute; top: 4px; right: 8px; cursor: pointer;
    color: #aaa; font-size: 16px; line-height: 1; border: none; background: none;
    z-index: 2; padding: 2px 4px;
  }
  /* 长回复：文字在框内滚动，关闭按钮 × 与底部按钮始终常驻，不会被推出或滚走 */
  #answerText, #screenText, #tipsText {
    max-height: calc(72vh - 96px); overflow-y: auto; overflow-wrap: anywhere;
    padding-right: 16px;
  }
  .box .actions { margin-top: 10px; display: flex; gap: 8px; }
  .box .actions button {
    flex: 1; border: 1px solid #4a4a52; background: #2b2b30; color: #f3f3f5;
    padding: 6px 0; border-radius: 6px; cursor: pointer; font-size: 12px;
  }
  .box .actions button:hover { background: #3a3a42; }

  /* 聊天框：消息气泡 */
  #chatLog { display: flex; flex-direction: column; gap: 6px; }
  #chatLog .row { display: flex; }
  #chatLog .row.me { justify-content: flex-end; }
  #chatLog .row.sys { justify-content: center; }
  #chatLog .bubble {
    max-width: 82%; padding: 5px 9px; border-radius: 10px;
    font-size: 12.5px; line-height: 1.5; overflow-wrap: anywhere; word-break: break-word;
  }
  #chatLog .row.me .bubble   { background: #3a6df0; color: #fff; border-bottom-right-radius: 3px; }
  #chatLog .row.pet .bubble { background: #37373d; color: #f3f3f5; border-bottom-left-radius: 3px; }
  #chatLog .row.sys .bubble { background: transparent; color: #9aa0a6; font-size: 11.5px; text-align: center; }

  /* 右键菜单 */
  #ctxMenu {
    position: fixed; z-index: 50; background: #fff; color: #2b2b2f;
    border: 1px solid #d6d8dc; border-radius: 8px; padding: 4px; font-size: 13px;
    box-shadow: 0 4px 16px rgba(0,0,0,.15); min-width: 96px;
  }
  #ctxMenu div { padding: 6px 12px; cursor: pointer; border-radius: 5px; }
  #ctxMenu div:hover { background: #f0f1f3; }

  .hidden { display: none !important; }

  /* 网页版：隐藏红色调试字(#dbg)；状态字(#status)与底部提示(.hint)保留，方便查看当前动作与心情 */
  #dbg { display: none !important; }
</style>

<script>
// ---------- 网页版：内置假 invoke（模拟 Tauri 桌面能力，桌面版用真后端） ----------
async function invoke(cmd, args) {
  // 桌面版：转发到 Tauri 真后端（前端已嵌进 exe；withGlobalTauri 暴露了 window.__TAURI__.core.invoke）
  if (typeof window.__TAURI_INTERNALS__ !== 'undefined' && window.__TAURI__ && window.__TAURI__.core) {
    return window.__TAURI__.core.invoke(cmd, args);
  }
  // 以下为网页演示版假数据（浏览器里跑得通，方便看动画 / 走通 UI 流程）
  if (cmd === 'capture_screen') {
    // 生成一张演示截图（非真实截屏），让看屏/搜题流程在浏览器里也能走通
    const c = document.createElement('canvas');
    c.width = 960; c.height = 600;
    const g = c.getContext('2d');
    g.fillStyle = '#eef1f5'; g.fillRect(0, 0, c.width, c.height);
    g.fillStyle = '#cfd6df'; g.fillRect(60, 90, 380, 220);
    g.fillStyle = '#b9c1cc'; g.fillRect(560, 90, 340, 140);
    g.fillStyle = '#2b2b2f'; g.font = '28px sans-serif';
    g.fillText('网页版演示截图（非真实截屏）', 60, 60);
    g.fillStyle = '#5b6470'; g.font = '20px sans-serif';
    g.fillText('拖动框选任意区域 → 交给「小火」分析', 60, 370);
    return c.toDataURL('image/png');
  }
  if (cmd === 'ask_glm') {
    return '（网页版演示）这是模拟的回答。\n桌面版会调用智谱 GLM-4V，真看懂你框选的屏幕内容并给出分析。';
  }
  if (cmd === 'ask_draw') {
    return '{"caption":"网页版演示","strokes":[{"prim":"circle","a":[150,205,42],"color":"#3aa655"},{"prim":"dot","a":[150,150,6],"color":"#2b2b2f"}]}';
  }
  if (cmd === 'critique_draw') {
    return '{"caption":"网页版演示","strokes":[{"prim":"circle","a":[150,205,42],"color":"#3aa655"}]}';
  }
  if (cmd === 'ask_reply') {
    return '（网页版演示）小火说：在桌面版里我才能真的和你聊天、调用智谱回答问题哦～';
  }
  if (cmd === 'toggle_pick') return;   // 全屏切换：网页版由前端 JS 直接控制，无需后端
  return undefined;
}

(() => {
  "use strict";
  const canvas = document.getElementById('stage');
  const ctx = canvas.getContext('2d');
  const W = canvas.width, H = canvas.height;
  const DEG = Math.PI / 180;
  const UP = -Math.PI / 2, DOWN = Math.PI / 2;
  const FIG_SCALE = 0.5;             // 桌面宠物整体缩放（偏小，更贴身）

  // ---------- 骨骼参数 ----------
  const S = {
    rootX: W / 2, rootY: H / 2 + 60,
    torsoLen: 85, neckLen: 16, headR: 24,
    thigh: 46, shin: 36, upperArm: 42, foreArm: 28,
    lineW: 6, color: '#2b2b2f',
  };
  const legSpread = 0.18, armSpread = 0.35;

  const point = (o, a, l) => ({ x: o.x + Math.cos(a) * l, y: o.y + Math.sin(a) * l });
  const lerp = (a, b, t) => a + (b - a) * t;
  const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));
  const easeInOut = t => t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;
  const rand = (a, b) => a + Math.random() * (b - a);

  // ---------- 姿态参数（状态只产出这组数字） ----------
  const BASE = {
    legSwing: 0, legFreq: 0,
    armSwing: 0, armFreq: 0,
    waveArm: 0, waveFreq: 8,
    lean: 0, headDrop: 0,
    bobAmp: 1.5, walkAmp: 0, walkFreq: 1.1,
    crouch: 0, scale: 1, opacity: 1,
    mouthOpen: 0, eyeOpen: 1,
    sad: 0, hug: 0, happy: 0, hop: 0, book: 0, sit: 0, sing: 0, read: 0, paint: 0,
    think: 0, headTilt: 0,
  };
  function poseForState(state, t) {
    const p = { ...BASE };
    switch (state) {
      case 'walk':
        p.legSwing = 28 * gaitJitter; p.legFreq = 6 * gaitJitter; p.armSwing = 18 * gaitJitter; p.armFreq = 6 * gaitJitter;
        p.bobAmp = 4; p.walkAmp = 24; p.walkFreq = 1.1 * gaitJitter; p.lean = 6; break;
      case 'run':
        p.legSwing = 42 * gaitJitter; p.legFreq = 10 * gaitJitter; p.armSwing = 30 * gaitJitter; p.armFreq = 10 * gaitJitter;
        p.bobAmp = 9; p.walkAmp = 40; p.walkFreq = 2.2 * gaitJitter; p.lean = 16; break;
      case 'wave':
        p.waveArm = 26; p.waveFreq = 8; p.armSwing = 4; p.armFreq = 5; break;
      case 'sleep':
        p.headDrop = 22; p.crouch = 14; p.eyeOpen = 0; p.bobAmp = 1.2; break;
      case 'read':
        p.crouch = 36; p.headDrop = 30; p.lean = 3; p.eyeOpen = 1;
        p.book = 1; p.sit = 1; p.read = 1; break;   // 坐地看书：低头看怀里书、双手捧书、身体轻前倾、安静阅读（不唱歌）
      case 'sing':
        p.lean = 3; p.headDrop = -3; p.happy = 1; p.sing = 1;
        p.waveArm = 16; p.waveFreq = 5; p.armSwing = 6; p.armFreq = 5; p.bobAmp = 3; p.eyeOpen = 1; break;  // 站着唱歌：闭眼陶醉、举臂打拍子、张嘴哼唱
      case 'hide':
        p.scale = 0.52; p.opacity = 0.9;
        p.headDrop = 30; p.crouch = 14; p.sad = 1; p.hug = 1; break;  // 委屈：缩角落、垂头、抱臂、含泪
      case 'paint':
        p.lean = 8; p.headDrop = -3; p.happy = 1; p.eyeOpen = 1;
        p.waveArm = 22; p.waveFreq = 4; p.armSwing = 2; p.armFreq = 4; break;  // 画画：举画笔手、专注前倾、开心
      case 'think':
        p.headDrop = 12; p.headTilt = 22; p.eyeOpen = 1; p.think = 1;
        p.armSwing = 3; p.armFreq = 4; break;   // 思考：歪头、手托下巴，想着怎么画
    }
    return p;
  }
  function lerpPose(a, b, t) {
    const r = {};
    for (const k in a) r[k] = a[k] + (b[k] - a[k]) * t;
    return r;
  }

  // ---------- 状态机 ----------
  let currState = 'idle', prevState = 'idle', transStart = -1e9;
  let nextSwitchAt = performance.now() + rand(2000, 8000);

  // 固定睡眠时段（本地时间）：到点强制"以睡为主、不漫游"；其余时间按加权随机
  const SLEEP_START = 23, SLEEP_END = 7;          // 23:00 ~ 07:00 固定睡眠
  function inSleepWindow() {
    const h = new Date().getHours();
    return h >= SLEEP_START || h < SLEEP_END;
  }

  // 各状态基础出现权重（walk/run/wave 平时更灵动，sleep 偶尔小睡）
  const WEIGHTS = { idle: 36, walk: 22, run: 8, wave: 12, sleep: 10, read: 8, sing: 6 };
  // 固定睡眠时段内的权重：以睡为主、偶尔翻身(idle)
  const WEIGHTS_SLEEP = { sleep: 78, idle: 22 };
  function pickAutoState(sleeping, now) {
    let w;
    if (sleeping) {
      w = WEIGHTS_SLEEP;                      // 夜间睡眠窗口：以睡为主，不受冷静期限制
    } else {
      // 白天：若处于 sleep/read 的冷静期内，临时去掉这两个状态，避免"刚睡醒又睡/刚看完又看"
      w = {};
      for (const k in WEIGHTS) {
        if (k === 'sleep' && now < sleepCD) continue;
        if (k === 'read'  && now < readCD)  continue;
        w[k] = WEIGHTS[k];
      }
    }
    let total = 0; for (const k in w) total += w[k];
    let r = Math.random() * total;
    for (const k in w) { r -= w[k]; if (r <= 0) return k; }
    return 'idle';
  }
  // 每个动作持续多久（更随机，小睡更久）
  function autoDuration(s) {
    switch (s) {
      case 'walk':  return rand(2000, 6000);
      case 'run':   return rand(1000, 3000);
      case 'wave':  return rand(1500, 4000);
      case 'sleep': return rand(20 * 60000, 40 * 60000);   // 长时间睡眠：20–40 分钟，少而久
      case 'idle':  return rand(2000, 8000);
      case 'read':  return rand(20 * 60000, 30 * 60000);   // 长时间阅读：20–30 分钟，少而久
      case 'sing':  return rand(3000, 7000);
      case 'paint': return 12000;       // 画画：画 2.6s + 展示约 8.4s 后消散
      default:      return rand(1500, 6000);
    }
  }
  function setState(s, dur) {
    if (s === currState) return;
    const wasSleep = currState === 'sleep', wasRead = currState === 'read';
    // 一次长休息结束（睡/读 → 其他状态）：进入白天冷静期，隔 120–240 分钟才允许再次"长休息"（sleep/read 共用，避免刚睡醒又看/刚看完又睡）
    if ((wasSleep || wasRead) && s !== 'sleep' && s !== 'read') {
      const cd = performance.now() + rand(120 * 60000, 240 * 60000);
      sleepCD = cd; readCD = cd;
    }
    const wasPaint = currState === 'paint';
    prevState = currState; currState = s;
    if (wasPaint && s !== 'paint') S.color = '#2b2b2f';  // 离开画画：恢复默认身体色
    transStart = performance.now();
    nextSwitchAt = performance.now() + (dur != null ? dur : autoDuration(s));
    if (s === 'walk' || s === 'run') gaitJitter = rand(0.8, 1.25);  // 每趟步态略有差异
  }

  // ---------- 鼠标 / 心情 ----------
  const mouse = { x: 0, y: 0, inside: false };
  let lookX = 0, lookY = 0;            // 平滑后的"看向鼠标"单位向量
  let gSC = 1;                         // 当前缩放（供 drawEyes / drawMouth 用）
  let mood = 0, clickCount = 0, lastPoke = 0;
  let speakingUntil = 0;
  let sleepCD = 0, readCD = 0;               // 长休息（睡觉/看书）结束后的白天冷静期截止时间
  let posX = S.rootX;                 // 火柴人当前水平锚点（躲开 / 缩角落都改这个，不再原地晃）
  let posY = S.rootY;                 // 垂直锚点；委屈缩到左下角时改这个
  let nextPeekAt = performance.now() + rand(3000, 5000);
  let peekStart = -1e9;
  // 漫游：宠物会自己走向随机目标，到了再选下一个，实现"到处跑"
  let roamTX = S.rootX, roamTY = S.rootY, roamPauseUntil = 0;

  // ---------- 构建火柴人 ----------
  function buildFigure(pose, t) {
    const sc = pose.scale * FIG_SCALE;
    const lieFrac = Math.min(1, lieAngle / TOPPLE_MAX);
    const breath = Math.sin(t * 1.5);
    const walkK = pose.legFreq ? 1 : 0;
    const step = pose.legFreq ? Math.sin(t * pose.legFreq) : 0;   // 迈步相位：左右腿反相
    // 走路起伏：迈大步(腿张开)时最低，并拢(支撑)时最高 → 两落点/步；倒地时压平呼吸起伏
    const bob = (breath * 1.0 + (walkK ? -pose.bobAmp * Math.abs(step) : 0)) * (1 - lieFrac);
    const xWalk = pose.walkAmp ? Math.sin(t * pose.walkFreq) * pose.walkAmp : 0;
    const sway = walkK ? Math.sin(t * pose.legFreq) * 2 * DEG : 0;  // 重心随步左右晃

    const sitDrop = pose.sit * 30 * sc;   // 坐姿单独下沉：屁股贴地，不靠压短 crouch
    const root = { x: posX + xWalk * sc, y: posY + bob * sc + pose.crouch * sc - pose.hop * sc + sitDrop };
    const torsoAngle = UP + pose.lean * DEG + breath * 0.025 + sway;
    const shoulders = point(root, torsoAngle, S.torsoLen * sc);

    // ---------- 头：朝鼠标转；但厌恶时拒绝看、甚至转头避开 ----------
    let headLean = 0;
    // 厌恶度：心情 < 0 起算（被戳一下就开始嫌弃），越负越厌恶，到 -100 满厌恶
    const disgust = mood < 0 ? clamp(-mood / 100, 0, 1) : 0;
    if (mouse.inside) {
      const dx = mouse.x - shoulders.x, dy = mouse.y - shoulders.y;
      let turn = Math.atan2(dy, dx) - UP;
      const dSh = Math.hypot(dx, dy) || 1;
      const prox = clamp(360 / Math.max(70, dSh), 0, 1);   // 越近跟得越多
      turn = Math.atan2(Math.sin(turn), Math.cos(turn));
      // 厌恶：把"转向鼠标"平滑翻成"背向鼠标"（disgust 0→正常跟, 0.5→不转, 1→转开）
      const turnEff = turn * (1 - 2 * disgust);
      headLean = clamp(turnEff, -0.7, 0.7) * (0.4 + 0.6 * prox);
    }
    if (pose.read > 0.5) headLean = 0;            // 看书时不跟鼠标转头，专注低头看书本
    if (pose.think > 0.5) headLean = 0;           // 思考时固定歪头，不跟鼠标转
    const headAxis = torsoAngle + pose.headDrop * DEG + headLean + (pose.think > 0.5 ? pose.headTilt * DEG : 0);
    const headBottom = point(shoulders, headAxis, S.neckLen * sc);
    // 注意：point() 只返回 {x,y}，没有 r；这里必须显式补 r，否则 head 半径为 undefined 而整颗头画不出来
    const headBase = { ...point(shoulders, headAxis, (S.neckLen + S.headR) * sc), r: S.headR * sc };

    // 头中心 / 眼珠朝鼠标方向轻移；厌恶时改成"看向反方向"（躲避视线接触）
    if (mouse.inside) {
      const dxh = mouse.x - headBase.x, dyh = mouse.y - headBase.y, dh = Math.hypot(dxh, dyh) || 1;
      const tox = dxh / dh, toy = dyh / dh;            // 朝鼠标
      const lx = lerp(tox, -tox, disgust);             // 厌恶越深越看反方向
      const ly = lerp(toy, -toy, disgust);
      lookX = lerp(lookX, lx, 0.18); lookY = lerp(lookY, ly, 0.18);
    } else {
      lookX = lerp(lookX, 0, 0.08); lookY = lerp(lookY, 0, 0.08);
    }
    if (pose.read > 0.5) { lookX = 0; lookY = 2.3; }   // 看书：眼睛沉到头下半部、视线朝下看怀里的书，不跟鼠标
    const head = { x: headBase.x + lookX * headBase.r * 0.24, y: headBase.y + lookY * headBase.r * 0.24, r: headBase.r };

    // ---------- 腿：大腿 + 小腿（带膝盖） ----------
    const thigh = S.thigh * sc, shin = S.shin * sc;
    const stance = legSpread * (walkK ? 0.35 : 1);
    const hipL = DOWN + stance + step * pose.legSwing * DEG;
    const hipR = DOWN - stance - step * pose.legSwing * DEG;
    // 走路：抬起的腿膝盖弯(脚往内收)，另一条蹬直；站着时小腿顺势微弯
    const kneeL = (0.12 + 0.45 * Math.max(0, step)) * walkK;
    const kneeR = (0.12 + 0.45 * Math.max(0, -step)) * walkK;
    // 坐地：大腿近水平外展(160°/20°)、小腿从膝盖水平折回中心(0°/180°) → 扁平"船形"盘腿底座，不是菱形（sit 从 0→1 平滑过渡）
    const sitAmt = clamp(pose.sit, 0, 1);
    const thighAngL = lerp(hipL, Math.PI - 0.35, sitAmt);
    const thighAngR = lerp(hipR, 0.35, sitAmt);
    const shinAngL  = lerp(hipL - kneeL, 0, sitAmt);
    const shinAngR  = lerp(hipR + kneeR, Math.PI, sitAmt);
    const kneePtL = point(root, thighAngL, thigh);
    const footL = point(kneePtL, shinAngL, shin);
    const kneePtR = point(root, thighAngR, thigh);
    const footR = point(kneePtR, shinAngR, shin);

    // ---------- 手臂：上臂 + 前臂（带手肘） ----------
    const aPhase = pose.armFreq ? Math.sin(t * pose.armFreq) : 0;
    const upper = S.upperArm * sc, fore = S.foreArm * sc;
    const restL = torsoAngle + Math.PI - armSpread;
    const restR = torsoAngle + Math.PI + armSpread;
    const wb = Math.min(1, pose.waveArm / 26);
    const waveTargetR = UP + 0.5;
    let elbowR = lerp(restR, waveTargetR, wb);
    elbowR += pose.waveArm < 0.01 ? aPhase * pose.armSwing * DEG : Math.sin(t * pose.waveFreq) * pose.waveArm * DEG;
    const elbowL = restL - aPhase * pose.armSwing * DEG;
    // 手肘自然弯：走路弯得多、待机近乎伸直；前臂向内/上收
    const eb = 0.2 + 0.32 * walkK;
    let elbowPtL = point(shoulders, elbowL, upper);
    let handL = point(elbowPtL, elbowL - eb, fore);
    let elbowPtR = point(shoulders, elbowR, upper);
    let handR = point(elbowPtR, elbowR + eb + (wb ? 0.3 : 0), fore);

    // 委屈抱臂：双手收到胸前中央（自我拥抱），与正常手臂姿态按 hug 插值
    if (pose.hug > 0.01) {
      const g = pose.hug;
      const lp = (a, b) => ({ x: lerp(a.x, b.x, g), y: lerp(a.y, b.y, g) });
      elbowPtL = lp(elbowPtL, { x: shoulders.x - 26 * sc, y: shoulders.y + 16 * sc });
      handL  = lp(handL,  { x: shoulders.x - 3  * sc, y: shoulders.y + 22 * sc });
      elbowPtR = lp(elbowPtR, { x: shoulders.x + 26 * sc, y: shoulders.y + 16 * sc });
      handR  = lp(handR,  { x: shoulders.x + 3  * sc, y: shoulders.y + 22 * sc });
    }
    // 看书：双肘向两侧撑出、前臂从书后绕入，双手藏在书下缘（捧读）；书盖住胸口，只露肘
    if (pose.read > 0.5) {
      const lp = (a, b) => ({ x: lerp(a.x, b.x, 1), y: lerp(a.y, b.y, 1) });
      elbowPtL = lp(elbowPtL, { x: shoulders.x - 34 * sc, y: shoulders.y + 20 * sc });
      handL  = lp(handL,  { x: shoulders.x - 26 * sc, y: shoulders.y + 38 * sc });
      elbowPtR = lp(elbowPtR, { x: shoulders.x + 34 * sc, y: shoulders.y + 20 * sc });
      handR  = lp(handR,  { x: shoulders.x + 26 * sc, y: shoulders.y + 38 * sc });
    }
    // 思考：右臂抬到下巴做"托腮"，左手自然垂（让"歪头托腮想怎么画"成立；
    // 不再另画一只悬空的手——全身是线条小人，哪都不该凭空冒出填充圆块）
    if (pose.think > 0.5) {
      const chin = { x: head.x + head.r * 0.5, y: head.y + head.r * 0.7 };
      elbowPtR = { x: shoulders.x + 28 * sc, y: shoulders.y + 6 * sc };
      handR = { x: chin.x, y: chin.y };
    }

    return { root, shoulders, headBottom, head, kneePtL, footL, kneePtR, footR, elbowPtL, handL, elbowPtR, handR };
  }

  function line(a, b) {
    ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke();
  }
  function drawEyes(head, eyeOpen, emo, now, happy) {
    const r = head.r, ex = 0.34 * r, ey = -0.12 * r;
    // 整张脸朝鼠标偏移，强化"转头看"的观感
    const fx = lookX * r * 0.16, fy = lookY * r * 0.16;
    const eyes = [{ x: head.x - ex + fx, y: head.y + ey + fy }, { x: head.x + ex + fx, y: head.y + ey + fy }];
    // 开心眼：^^ 弯弯笑眼（哄好时触发，覆盖其他眼型）
    if (happy > 0.5) {
      ctx.lineWidth = Math.max(1.4, 1.8 * gSC); ctx.strokeStyle = S.color;
      for (const p of eyes) {
        ctx.beginPath(); ctx.arc(p.x, p.y - r * 0.02, r * 0.2, 1.2 * Math.PI, 1.8 * Math.PI); ctx.stroke();
      }
      return;
    }
    ctx.lineWidth = Math.max(1, 1.2 * gSC); ctx.strokeStyle = S.color; ctx.fillStyle = '#fff';
    if (eyeOpen > 0.5) {
      for (const p of eyes) {
        ctx.fillStyle = '#fff';   // 每只眼重设眼白：上一只的瞳孔把 fillStyle 改成了深色，否则右眼眼白会被填黑
        ctx.beginPath(); ctx.arc(p.x, p.y, r * 0.17, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
        // 瞳孔明显朝鼠标偏移
        const px = p.x + lookX * r * 0.09, py = p.y + clamp(lookY, -1, 1) * r * 0.09;   // 瞳孔偏移钳制在眼眶内（看书时 lookY 会大于 1）
        ctx.beginPath(); ctx.arc(px, py, r * 0.09, 0, Math.PI * 2); ctx.fillStyle = S.color; ctx.fill();
      }
    } else {
      ctx.lineWidth = Math.max(1.4, 1.6 * gSC);
      for (const p of eyes) {
        if (emo > 0.5) {
          ctx.beginPath(); ctx.arc(p.x, p.y + r * 0.06, r * 0.16, 1.15 * Math.PI, 1.85 * Math.PI); ctx.stroke();
        } else {
          ctx.beginPath(); ctx.moveTo(p.x - r * 0.12, p.y); ctx.lineTo(p.x + r * 0.12, p.y); ctx.stroke();
        }
      }
    }
    // 委屈眉：emo 越大皱得越明显（内低外高的八字眉，emo=0 时不画），让"被戳就变脸"看得出来
    if (emo > 0.12) {
      const a = clamp((emo - 0.12) / 0.6, 0, 1);
      ctx.lineWidth = Math.max(1, 1.4 * gSC);
      for (const p of eyes) {
        ctx.beginPath();
        ctx.moveTo(p.x - r * 0.2, p.y - r * 0.36 - r * 0.05 * a);
        ctx.quadraticCurveTo(p.x, p.y - r * 0.46 + r * 0.07 * a, p.x + r * 0.2, p.y - r * 0.36 - r * 0.13 * a);
        ctx.stroke();
      }
    }
    // 委屈泪：emo 越高泪越多，循环滑落（原来只在大 sad 才有，现在连续：>0.55 起泪，>0.85 双眼都哭）
    if (emo > 0.55) {
      const n = emo > 0.85 ? 2 : 1;
      for (let i = 0; i < n; i++) {
        const p = eyes[i], fall = ((now * 0.0007) + i * 0.5) % 1;
        const ty = p.y + r * 0.18 + fall * r * 1.4;
        ctx.beginPath(); ctx.ellipse(p.x, ty, r * 0.06, r * 0.1, 0, 0, Math.PI * 2);
        ctx.fillStyle = 'rgba(90,160,230,' + (0.85 * (1 - fall)).toFixed(2) + ')'; ctx.fill();
      }
    }
  }
  function drawMouth(head, mo, emo, happy, sing) {
    const r = head.r, hy = head.y + r * 0.42, mw = r * 0.5;
    // 唱歌：明显张开的嘴（随节奏），用于 sing 状态（盖过开心弧与说话嘴）
    if (sing > 0.5) {
      const oh = mo * r * 0.55;
      ctx.beginPath(); ctx.ellipse(head.x, hy, mw * 0.82, Math.max(oh, r * 0.12), 0, 0, Math.PI * 2);
      ctx.fillStyle = S.color; ctx.fill();
      return;
    }
    // 开心大笑：明显上扬的大笑嘴（被揉头时触发，盖过委屈/平嘴）
    if (happy > 0.5 && emo < 0.5) {
      ctx.lineWidth = Math.max(1.6, 2 * gSC); ctx.strokeStyle = S.color;
      ctx.beginPath(); ctx.arc(head.x, hy - r * 0.02, mw * 0.95, 0.15 * Math.PI, 0.85 * Math.PI); ctx.stroke();
      return;
    }
    if (mo > 0.18) {
      // 张嘴（说话 / 被戳惊呼）：开口向上的椭圆（颜色填充）
      const oh = mo * r * 0.42;
      ctx.beginPath(); ctx.ellipse(head.x, hy, mw * 0.72, oh, 0, 0, Math.PI * 2);
      ctx.fillStyle = S.color; ctx.fill();
      return;
    }
    // 闭嘴：连续弯曲的嘴线。emo 越大，嘴角越下垂（委屈）；emo=0 时中性平嘴（不再傻笑）
    const drop = lerp(0, 1, clamp(emo, 0, 1));   // 0=平, 1=明显下凹(哭)
    ctx.beginPath();
    ctx.moveTo(head.x - mw, hy);
    ctx.quadraticCurveTo(head.x, hy + drop * r * 0.5, head.x + mw, hy);
    ctx.stroke();
  }

  function draw(pose, t, now) {
    ctx.clearRect(0, 0, W, H);
    drawArtworks(now);          // 先画已存在的画作（小火画的画），再画小火本身
    // 被戳瞬间来一下"缩一下"的弹性反馈（约 180ms），让"戳到了"有即时视觉确认
    let punch = 1;
    if (now - pokeFlash < 180) punch = 1 - 0.14 * Math.sin((now - pokeFlash) / 180 * Math.PI);
    const sc = pose.scale * FIG_SCALE * punch; gSC = sc;
    const k = buildFigure(pose, t);
    const lieFrac = Math.min(1, lieAngle / TOPPLE_MAX);

    // 阴影（倒地时画成长条，贴着地面；直立时画在脚底）
    ctx.save();
    ctx.globalAlpha = 0.12 * pose.opacity;
    ctx.fillStyle = '#000';
    if (lieFrac > 0.05) {
      const px = (k.footL.x + k.footR.x) / 2, py = (k.footL.y + k.footR.y) / 2;
      const len = (S.torsoLen + S.neckLen + S.headR + S.thigh + S.shin) * sc;
      ctx.beginPath(); ctx.ellipse(px, py + 4 * sc, len * 0.55, 9 * sc, 0, 0, Math.PI * 2); ctx.fill();
    } else {
      ctx.beginPath(); ctx.ellipse(k.root.x, k.footL.y + 6 * sc, 56 * sc, 10 * sc, 0, 0, Math.PI * 2); ctx.fill();
    }
    ctx.restore();

    ctx.save();
    ctx.globalAlpha = pose.opacity;
    ctx.strokeStyle = S.color; ctx.lineWidth = S.lineW * sc;
    ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    // 深度睡眠：睡着一会儿后整只人绕脚底翻倒躺平（倒地睡）
    if (lieAngle > 0.001) {
      const px = (k.footL.x + k.footR.x) / 2, py = (k.footL.y + k.footR.y) / 2;
      ctx.translate(px, py); ctx.rotate(lieAngle); ctx.translate(-px, -py);
    }

    line(k.root, k.kneePtL); line(k.kneePtL, k.footL);
    line(k.root, k.kneePtR); line(k.kneePtR, k.footR);
    line(k.root, k.shoulders);
    line(k.shoulders, k.headBottom);
    line(k.shoulders, k.elbowPtL); line(k.elbowPtL, k.handL);
    line(k.shoulders, k.elbowPtR); line(k.elbowPtR, k.handR);

    ctx.beginPath(); ctx.arc(k.head.x, k.head.y, k.head.r, 0, Math.PI * 2); ctx.stroke();
    drawEyes(k.head, pose.eyeOpen, pose.sad, now, pose.happy);
    let mo = 0.06;
    if (pose.sing > 0.5) mo = 0.2 + 0.55 * Math.abs(Math.sin(t * 7));     // 唱歌：嘴随节奏张合
    else if (now < speakingUntil) mo = 0.12 + 0.8 * Math.abs(Math.sin(t * 15));
    if (now - pokeFlash < 180) mo = Math.max(mo, 0.5);   // 被戳瞬间张嘴惊呼，强化"变脸"
    drawMouth(k.head, mo, pose.sad, pose.happy, pose.sing);

    // 睡眠时画 Zzz（eyeOpen<0.35 即在睡；状态过渡时随 lerp 自然淡入淡出）
    if (pose.eyeOpen < 0.35) {
      const zt = t * 1.6;
      ctx.save();
      ctx.fillStyle = S.color;
      for (let i = 0; i < 3; i++) {
        const ph = (zt + i * 0.7) % 3;
        const a = 1 - ph / 3;
        const sz = (9 + i * 6) * sc;
        ctx.globalAlpha = pose.opacity * a * 0.75;
        ctx.font = sz + 'px sans-serif';
        ctx.fillText('z', k.head.x + 16 * sc + i * 9 * sc, k.head.y - 16 * sc - i * 11 * sc - ph * 7 * sc);
      }
      ctx.restore();
    }
    ctx.restore();

    // 揉头（按住头顶搓）：在光标处画一只手来回揉动，配上笑眼/舒服表情（手随鼠标走）
    if (now < petUntil) {
      const wobX = Math.sin(now * 0.012) * 7 * sc;     // 左右搓的位移（明显来回，区别于"戳"）
      const hx = mouse.x + wobX, hy = mouse.y;
      ctx.save();
      ctx.globalAlpha = 0.9;
      ctx.strokeStyle = S.color; ctx.fillStyle = 'rgba(43,43,47,0.16)'; ctx.lineCap = 'round';
      ctx.lineWidth = S.lineW * sc * 0.8;
      ctx.beginPath(); ctx.ellipse(hx, hy, 15 * sc, 12 * sc, 0, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
      for (let i = 0; i < 4; i++) {                    // 手指
        const fx2 = hx - 10 * sc + i * 7 * sc;
        ctx.beginPath(); ctx.moveTo(fx2, hy - 8 * sc); ctx.lineTo(fx2, hy - 17 * sc); ctx.stroke();
      }
      // 搓动小弧线（明示"在揉"而非"在戳"）
      ctx.globalAlpha = 0.5;
      ctx.beginPath(); ctx.arc(hx, hy + 18 * sc, 9 * sc, Math.PI * 1.15, Math.PI * 1.85); ctx.stroke();
      ctx.restore();
    }

    // 看书：把书托到下巴/胸口前（双手举着），微微上翘朝向脸，安静阅读（不唱歌）
    if (pose.book > 0.5) {
      const bx = k.root.x + 8 * sc, by = k.shoulders.y + 34 * sc;   // 书在胸前、下巴正下方（不压脸）
      const bw = 36 * sc, bh = 26 * sc;
      ctx.save();
      ctx.globalAlpha = pose.opacity;
      ctx.translate(bx, by);
      ctx.rotate(-0.22);                                    // 微微上翘，书页朝向脸，方便看字
      ctx.strokeStyle = S.color; ctx.lineWidth = S.lineW * sc * 0.45;   // 书描边细一点，避免和手臂糊成黑块
      ctx.fillStyle = 'rgba(255,255,255,.92)';
      const topW = bw * 0.82, botW = bw;                    // 透视：远端(顶)略窄，像书页朝向眼睛
      // 左页 / 右页（梯形：上窄下宽）
      ctx.beginPath();
      ctx.moveTo(0, -bh * 0.5); ctx.lineTo(-topW, -bh * 0.4);
      ctx.lineTo(-botW, bh * 0.5); ctx.lineTo(0, bh * 0.62);
      ctx.closePath(); ctx.fill(); ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(0, -bh * 0.5); ctx.lineTo(topW, -bh * 0.4);
      ctx.lineTo(botW, bh * 0.5); ctx.lineTo(0, bh * 0.62);
      ctx.closePath(); ctx.fill(); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(0, -bh * 0.5); ctx.lineTo(0, bh * 0.62); ctx.stroke();   // 中缝
      // 文字线
      ctx.lineWidth = S.lineW * sc * 0.3;
      for (let i = 1; i <= 3; i++) {
        const yy = -bh * 0.28 + i * bh * 0.28;
        ctx.beginPath(); ctx.moveTo(-botW * 0.8, yy); ctx.lineTo(-botW * 0.12, yy - 1 * sc); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(botW * 0.12, yy - 1 * sc); ctx.lineTo(botW * 0.8, yy); ctx.stroke();
      }
      ctx.restore();
    }

    // 唱歌：头顶飘出的音符（♪♫），随节奏上飘（draw 内绘制，sing 时随头顶上飘）
    if (pose.sing > 0.5) {
      ctx.save();
      ctx.fillStyle = '#ff8a3d';
      for (let i = 0; i < 3; i++) {
        const ph = ((now * 0.0011) + i * 0.4) % 1;
        const nx = k.head.x + Math.sin(now * 0.004 + i * 2) * 18 * sc;
        const ny = k.head.y - 24 * sc - ph * 66 * sc;
        const sz = (12 + i * 2) * sc * (1 - ph * 0.3);
        ctx.globalAlpha = pose.opacity * (1 - ph) * 0.85;
        ctx.font = sz + 'px sans-serif';
        ctx.fillText(i % 2 ? '♫' : '♪', nx, ny);
      }
      ctx.restore();
    }

    // 开心：头顶飘爱心（被宠/揉头使 mood 转正时），mirror 唱歌音符
    if (pose.happy > 0.5) {
      ctx.save();
      ctx.fillStyle = '#ff5b8a';
      for (let i = 0; i < 2; i++) {
        const ph = ((now * 0.0012) + i * 0.5) % 1;
        const nx = k.head.x + Math.sin(now * 0.005 + i * 2) * 14 * sc;
        const ny = k.head.y - 22 * sc - ph * 60 * sc;
        const sz = (10 + i * 2) * sc * (1 - ph * 0.3);
        ctx.globalAlpha = pose.opacity * (1 - ph) * 0.9;
        ctx.font = sz + 'px sans-serif';
        ctx.fillText('♥', nx, ny);
      }
      ctx.restore();
    }
    // 思考：头顶飘一个正经的"思考泡泡"（白底描边 + 由小到大的尾迹）；
    // 手托腮已由 buildFigure 把右臂抬到下巴实现，这里只画泡泡，不另画悬空的手
    if (pose.think > 0.5) {
      ctx.save();
      ctx.globalAlpha = pose.opacity;
      ctx.strokeStyle = 'rgba(110,120,130,.9)';
      ctx.fillStyle = '#fff';
      ctx.lineWidth = Math.max(1, 1.1 * gSC);
      // 尾迹：头顶到主泡泡之间由小到大的几个圆（经典 thought bubble）
      const bigX = k.head.x + k.head.r * 1.7, bigY = k.head.y - k.head.r * 1.7 - Math.sin(now * 0.003) * 3 * sc;
      for (let i = 2; i >= 0; i--) {
        const t = i / 2;
        const cx = lerp(k.head.x + k.head.r * 0.25, bigX, t);
        const cy = lerp(k.head.y - k.head.r * 0.85, bigY, t);
        const rr = (2.2 + (2 - i) * 1.3) * sc;
        ctx.beginPath(); ctx.arc(cx, cy, rr, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
      }
      // 主泡泡：白底描边
      ctx.beginPath(); ctx.arc(bigX, bigY, 11 * sc, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
      // 泡泡里一个"?"表示在琢磨
      ctx.fillStyle = 'rgba(110,120,130,.95)';
      ctx.font = (10 * sc) + 'px sans-serif';
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText('?', bigX, bigY + 0.5 * sc);
      ctx.restore();
    }
    if (pose.paint > 0.5) drawPaintHand(k, sc, pose);  // 画画：举画笔手，像拿笔画画
  }

  // ================= 绘画系统 =================
  // 画作池：每幅画是一个对象，有绘画过程(drawing)与生命周期(life)，到期自动消散
  let artworkPool = [];
  let activeArt = null;            // 当前正在画的那幅（用于小火变色）
  class Drawing {
    constructor(type, x, y, strokes) {
      this.type = type; this.x = x; this.y = y; this.strokes = strokes;
      this.birth = performance.now();
      this.drawDur = 2600;         // 逐笔画出耗时（小火一笔笔画）
      this.life = 11000;           // 总寿命：画完展示约 8.4s 后消散
      this.color = '#2b2b2f';
    }
  }
  // 真·粒子烟花：升空 → 爆开 → 重力下落 → 渐隐（取代原来的静态放射线，看着才像烟花）
  const FW_COLORS = ['#ff5b8a', '#ffd23d', '#6ab0ff', '#3aa655', '#b07cff', '#ff8a3d'];
  // 小火"自己画"的线稿用色：临摹/生成路线不再用纯黑(#'2b2b2f')，改为亮色调色板，产生颜色变化
  const ART_LINE_COLORS = ['#ff5b8a', '#ffd23d', '#6ab0ff', '#3aa655', '#b07cff', '#ff8a3d', '#2bb6c4'];
  function fwColor() { return FW_COLORS[Math.floor(Math.random() * FW_COLORS.length)]; }
  class FireworkFX {
    constructor(x, y) {
      this.x = x; this.y = y; this.born = performance.now();
      this.life = 11000; this.isFx = true; this.dead = false;
      this.glowColor = '#ff5b8a';   // 当前主色：身体随最近一次升空/爆炸的颜色变化（解决"画烟花不变色"）
      this.rockets = []; this.sparks = []; this.lastLaunch = -1e9;
    }
    tick(now) {
      const age = now - this.born;
      // 周期性发射新火箭（整场表演结束前 1.5s 停发）
      if (now - this.lastLaunch > 600 && this.rockets.length < 7 && age < this.life - 1500) {
        this.lastLaunch = now;
        const tx = this.x + (Math.random() - 0.5) * 150;
        const ty = this.y - 120 - Math.random() * 60;
        const col = fwColor(); this.glowColor = col;   // 升空中：身体先染上这发颜色
        this.rockets.push({ x: tx + (Math.random() - 0.5) * 16, y: this.y, vx: (tx - this.x) * 0.01, vy: -3.6 - Math.random() * 1.6, target: ty, color: col });
      }
      // 火箭上升（重力减速），到顶点或越过目标高度即爆开
      for (let i = this.rockets.length - 1; i >= 0; i--) {
        const r = this.rockets[i];
        r.x += r.vx; r.y += r.vy; r.vy += 0.05;
        if (r.vy >= 0 || r.y <= r.target) { this.explode(r.x, r.y, r.color); this.rockets.splice(i, 1); }
      }
      // 火星：向外飞 + 重力下落 + 寿命衰减（重力调小、寿命调长 → 更密更久）
      for (let i = this.sparks.length - 1; i >= 0; i--) {
        const s = this.sparks[i];
        s.x += s.vx; s.y += s.vy; s.vy += 0.055; s.vx *= 0.99; s.life -= 16;
        if (s.life <= 0) this.sparks.splice(i, 1);
      }
      if (age > this.life && this.rockets.length === 0 && this.sparks.length === 0) this.dead = true;
    }
    explode(x, y, color) {
      this.glowColor = color;   // 爆炸瞬间：身体染上这团火星的颜色
      const n = 42 + Math.floor(Math.random() * 26);   // 42~68 颗，比之前密一倍
      for (let i = 0; i < n; i++) {
        const ang = Math.random() * Math.PI * 2, sp = 1.0 + Math.random() * 4.8;
        this.sparks.push({ x, y, vx: Math.cos(ang) * sp, vy: Math.sin(ang) * sp, color, life: 1100 + Math.random() * 900 });
      }
    }
    render(ctx) {
      ctx.save();
      ctx.lineCap = 'round'; ctx.lineWidth = 2.4;
      for (const r of this.rockets) {          // 上升中的火箭：拖一条短尾迹
        ctx.strokeStyle = r.color; ctx.globalAlpha = 1;
        ctx.beginPath(); ctx.moveTo(r.x, r.y); ctx.lineTo(r.x - r.vx * 2.2, r.y - r.vy * 2.2); ctx.stroke();
      }
      for (const s of this.sparks) {           // 爆开后的火星：按剩余寿命渐隐
        ctx.globalAlpha = clamp(s.life / 1100, 0, 1);
        ctx.strokeStyle = s.color;
        ctx.beginPath(); ctx.moveTo(s.x, s.y); ctx.lineTo(s.x - s.vx * 1.6, s.y - s.vy * 1.6); ctx.stroke();
      }
      ctx.restore();
    }
  }
  // 原语：用 prog(0→1) 控制"画到哪"，实现逐步作画（线条/圆/波浪/星/涂鸦）
  function primLine(ctx, a, prog) {
    const [x1, y1, x2, y2] = a; const t = prog;
    ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x1 + (x2 - x1) * t, y1 + (y2 - y1) * t); ctx.stroke();
  }
  function primCircle(ctx, a, prog) {
    const [cx, cy, r] = a; ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI * 2 * prog); ctx.stroke();
  }
  function primWave(ctx, a, prog) {
    const [x1, y1, x2, y2, freq] = a; const n = 40; const seg = Math.floor(n * prog);
    ctx.beginPath(); ctx.moveTo(x1, y1);
    for (let i = 1; i <= seg; i++) { const t = i / n; const x = x1 + (x2 - x1) * t; const y = y1 + (y2 - y1) * t + Math.sin(t * Math.PI * freq) * 8; ctx.lineTo(x, y); }
    ctx.stroke();
  }
  function primStar(ctx, a, prog) {
    const [cx, cy, R, spikes] = a; const n = spikes * 2; const seg = Math.max(1, Math.floor(n * prog));
    ctx.beginPath();
    for (let i = 0; i <= seg; i++) { const ang = -Math.PI / 2 + i * Math.PI / spikes; const rr = i % 2 ? R * 0.45 : R; const x = cx + Math.cos(ang) * rr; const y = cy + Math.sin(ang) * rr; i ? ctx.lineTo(x, y) : ctx.moveTo(x, y); }
    ctx.stroke();
  }
  function primScribble(ctx, a, prog) {
    const [cx, cy, seed] = a; let s = seed; const rnd = () => { s = (s * 9301 + 49297) % 233280; return s / 233280; };
    const R = 34;   // 限制涂鸦范围，避免把整只动物糊成一团
    const n = 16; const seg = Math.max(1, Math.floor(n * prog)); ctx.beginPath(); ctx.moveTo(cx, cy);

    for (const k of keys) if (t.includes(k)) return ZH_EN[k].slice();

  function extractFirstPath(svg) {

  // 把一个 SVG path 的 d 按 M 拆成多条子路径并采样为折线（图标原始坐标空间）
  function sampleIcon(d, viewBox) {
    const sub = (d.match(/[Mm][^Mm]*/g) || [d]).map(s => s.trim()).filter(Boolean);
    const svgns = 'http://www.w3.org/2000/svg';
    const svg = document.createElementNS(svgns, 'svg');
    svg.setAttribute('viewBox', viewBox || '0 0 24 24');
    svg.style.cssText = 'position:absolute;left:-99999px;top:-99999px;width:24px;height:24px;';
    document.body.appendChild(svg);
    const polys = [];
    try {
      for (const sd of sub) {
        const p = document.createElementNS(svgns, 'path');
        p.setAttribute('d', sd);
        svg.appendChild(p);
        let pts = [];
        const total = p.getTotalLength();
        if (total > 0.01 && total < 1e6) {
          const step = Math.max(1.2, total / 160);
          for (let l = 0; l <= total; l += step) { const pt = p.getPointAtLength(l); pts.push([pt.x, pt.y]); }
        }
        svg.removeChild(p);
        if (pts.length >= 2) polys.push(pts);

  // 把图标折线（原始坐标空间）映射到小火画作坐标，生成 poly 笔画
  function iconifyStrokes(polys, cx, cy, s, icx, icy) {
    const out = [];
    for (const poly of polys) {
      if (poly.length < 2) continue;
      const a = [];
      for (const [ix, iy] of poly) a.push(cx + (ix - icx) * s, cy + (iy - icy) * s);
      out.push({ color: ART_LINE_COLORS[out.length % ART_LINE_COLORS.length], prim: 'poly', a });

  // 主流程：先翻图标库临摹（多候选依次尝试）；全失败再丢给 LLM 兜底
  async function iconPaint(v) {
    const box = document.getElementById('paintBox');
    const hint = document.getElementById('paintHint');
    const go = document.getElementById('paintGo');
    box.classList.remove('hidden');
    setState('think', 120000);   // 翻图标库前也先"思考"一下，回来再画
    const recoverBtn = () => { if (go) { go.disabled = false; go.textContent = '画！'; } };
    const queries = toIconQueries(v);
    if (!queries.length) {
      if (hint) hint.textContent = '（图标库没有这个词，让小火自己想）';
      recoverBtn(); return qdPaint(v);
    }
    if (hint) hint.textContent = '🤔 小火翻了翻图标库找「' + v + '」…';
    if (go) { go.disabled = true; go.textContent = '找…'; }
    for (const q of queries) {
      try {
        const sr = await fetch('https://api.iconify.design/search?query=' + encodeURIComponent(q) + '&limit=48', { mode: 'cors' });
        if (!sr.ok) continue;
        const sj = await sr.json();
        const icon = pickIcon(sj.icons || []);
        if (!icon) continue;
        // 用权威批量接口取图标数据（单图标接口 mdi:snake.json 已全局 404 失效）
        const parts = icon.split(':'); const ip = parts[0]; const iname = parts[1] || parts[0];
        const jr = await fetch('https://api.iconify.design/' + ip + '.json?icons=' + encodeURIComponent(iname), { mode: 'cors' });
        if (!jr.ok) continue;
        const jj = await jr.json();
        const entry = jj && jj.icons && jj.icons[iname];
        if (!entry || !entry.body) continue;
        const vb = (entry.viewBox || jj.viewBox || ('0 0 ' + (jj.width || 24) + ' ' + (jj.height || 24))).trim().split(/\s+/).map(Number);
        const vw = vb[2] || 24, vh = vb[3] || 24;
        const size = Math.max(vw, vh) || 24;
        const polys = [];
        for (const d of iconPaths(entry.body)) { const ps = sampleIcon(d, vb.join(' ')); for (const p of ps) polys.push(p); }
        if (!polys.length) continue;
        const ax = posX + 96, ay = posY + 36;
        const strokes = iconifyStrokes(polys, ax, ay - 50, 150 / size, vw / 2, vh / 2);
        if (hint) hint.textContent = '🎨 找到啦，临摹！';
        recoverBtn();
        setTimeout(() => box.classList.add('hidden'), 500);
        startPaintStrokes(strokes);
        return;
      } catch (e) { /* 试下一个候选 */ }
    }
    console.warn('[iconify] 所有候选都没找到可用图标，转 QD/LLM');
    if (hint) hint.textContent = '😵 图标库没找到，让小火自己想～';
    recoverBtn();
    return qdPaint(v);
  }
  // 手写模板优先：常见词直接用预调坐标的简笔画（牛/羊/烟花/猫/狗…），质量 100% 可控
  function knownTemplate(v) {
    const t = (v || '').toLowerCase();
    if (t.includes('烟花') || t.includes('烟火') || t.includes('火花') || t.includes('爆竹')) return 'fireworks';
    if (t.includes('牛')) return 'cow';
    if (t.includes('羊')) return 'sheep';
    if (t.includes('猫')) return 'cat';
    if (t.includes('狗')) return 'dog';
    if (t.includes('兔')) return 'rabbit';
    if (t.includes('鱼')) return 'fish';
    if (t.includes('房子') || t.includes('屋子') || t.includes('家')) return 'house';
    if (t.includes('心')) return 'heart';
    if (t.includes('火箭') || t.includes('飞船')) return 'rocket';
    if (t.includes('月亮') || t.includes('月') || t.includes('moon')) return 'moon';
    if (t.includes('旗') || t.includes('国旗') || t.includes('flag')) return 'flag';
    if (t.includes('圣诞') || t.includes('圣诞树') || t.includes('xmas') || t.includes('christmas')) return 'christmas';
    return null;
  }
  function submitPaint() {
    const v = document.getElementById('paintText').value.trim();
    const tmpl = knownTemplate(v);
    if (tmpl) { document.getElementById('paintBox').classList.add('hidden'); startPaint(tmpl); return; }
    const t = knownPaint(v);
    const tl = v.toLowerCase();
    if (t) { document.getElementById('paintBox').classList.add('hidden'); startPaint(t); }
    else if (/烟花|烟火|火花|爆竹/.test(tl)) { llmPaint(v); }   // 保底：模板万一没命中，仍走 LLM 而非被当成花
    else { iconPaint(v); }   // 再查图标库临摹；失败/无图标才丢给 LLM
  }
  document.getElementById('paintBox').querySelector('.close').addEventListener('click', () => {
    document.getElementById('paintBox').classList.add('hidden');
  });
  document.getElementById('paintGo').addEventListener('click', submitPaint);
  document.getElementById('paintText').addEventListener('keydown', e => { if (e.key === 'Enter') submitPaint(); });

  // ---- 让智谱"思考"怎么画：自由文本 → 原语 JSON → 笔画 ----
  function extractJson(s) {

    // 刚睡醒的伸展（约 900ms：抬头 + 举臂），让"固定睡眠→天亮醒来"有过渡
    if (prevState === 'sleep' && currState !== 'sleep' && now - transStart < 900) {
      pose.headDrop = lerp(pose.headDrop, 0, 0.25);
      pose.waveArm = Math.max(pose.waveArm, 28);
    }

    // 哄好（被揉头）：开心的笑眼 + 抬头，不再蹦跳（缓缓揉头的手在 draw 里画）
    if (now < petUntil) {
      pose.happy = 1; pose.eyeOpen = 1; pose.sad = 0;
      pose.headDrop = Math.min(pose.headDrop, 0);
      pose.hop = 0;
    }

    if (currState === 'paint') {
      if (activeArt && activeArt.isFx) S.color = activeArt.glowColor || S.color;        // 粒子烟花：身体跟随最近一次爆炸/升空的颜色
      else if (activeArt && activeArt.strokes) S.color = paintColorAt(activeArt, now);   // 普通画作：跟随当前笔画颜色
    }
    draw(pose, t, now);
    // 状态栏显示当前状态 / 心情 / 鼠标（网页版无穿透概念，省略那部分）
    const petting = (now < petUntil);
    const poked = (now - pokeFlash < 400) ? ' · 被戳!' : '';
    const moodWord = mood > 5 ? '开心' : mood < -5 ? '委屈' : '平静';
    statusEl.textContent = `状态：${currState}${petting ? ' · 被揉头~' : ''} · 心情：${Math.round(mood)}（${moodWord}） · 鼠标：${mouse.inside ? Math.round(mouse.x) + ',' + Math.round(mouse.y) : '外'}${poked}`;
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);

  // ---------- 节日日历：到日子就自动画一幅应景的画 ----------
  const FESTIVALS = [
    { m: 1, d: 1, type: 'fireworks', name: '元旦' },
    { m: 2, d: 14, type: 'heart', name: '情人节' },
    { m: 3, d: 8, type: 'flower', name: '妇女节' },
    { m: 6, d: 1, type: 'star', name: '儿童节' },
    { m: 10, d: 1, type: 'flag', name: '国庆节' },
    { m: 12, d: 25, type: 'christmas', name: '圣诞节' },
  ];
  let lastFestivalKey = '';
  function todayFestival() {
    const n = new Date();
    for (const f of FESTIVALS) if (f.m === n.getMonth() + 1 && f.d === n.getDate()) return f;
    return null;
  }
  function maybeFestivalPaint() {
    const f = todayFestival();
    const today = new Date().toDateString();
    if (!f) { lastFestivalKey = ''; return; }      // 非节日：清空标记，跨天后再遇节日可再画
    if (lastFestivalKey === today) return;          // 今天已画过，跳过（避免每小时重复画）
    lastFestivalKey = today;
    setTimeout(() => { if (currState !== 'paint') startPaint(f.type); }, 2500);
  }
  maybeFestivalPaint();
  setInterval(maybeFestivalPaint, 60 * 60 * 1000);  // 每小时复查，跨天若恰逢节日也会补画

  // ---------- 看屏理解 / 搜题（网页版用演示图模拟；桌面版真截屏 + 智谱 GLM-4V） ----------
  const answerBox = document.getElementById('answerBox');
  const answerText = document.getElementById('answerText');
  const pickLayer = document.getElementById('pickLayer');
  const pickImg = document.getElementById('pickImg');
  const pickRect = document.getElementById('pickRect');
  const pickHint = document.getElementById('pickHint');
  let picking = false, pickStart = null, lastRegionB64 = '', currentAct = 'search';

  function closeAllPick() {
    picking = false;
    pickLayer.classList.add('hidden');
    pickRect.style.display = 'none';
    if (isTauri) invoke('toggle_pick', { full: false }).catch(() => {});
  }

  function startPick(act) {
    currentAct = act;
    pickHint.textContent = act === 'search'
      ? '拖拽框选题目/问题区域，松手即解题'
      : '拖拽框选你看的屏幕区域，松手即描述';
    // 网页版：invoke('capture_screen') 返回演示图；invoke('toggle_pick') 为前端直接控制，此处走通用流程
    Promise.resolve(invoke('capture_screen'))
      .then(dataUrl => new Promise((res, rej) => {    // 先把图加载进 <img>（此时图层还藏着，离屏加载）
        const ok = () => (pickImg.naturalWidth > 0 ? res() : rej(new Error('截屏图加载失败')));
        pickImg.onload = ok; pickImg.onerror = () => rej(new Error('截屏图加载失败'));
        pickImg.src = dataUrl;
        if (pickImg.complete) ok();                   // 已缓存则直接完成（onload 可能不再触发）
      }))
      .then(() => invoke('toggle_pick', { full: true }))   // 图已就绪，再全屏
      .then(() => {
        picking = true;
        pickLayer.classList.remove('hidden');
        pickRect.style.display = 'none';
      })
      .catch(err => {
        answerText.innerHTML = '截屏/全屏失败：' + (err && err.message ? err.message : err);
        answerBox.style.left = '50%'; answerBox.style.top = '40%';
        answerBox.style.transform = 'translate(-50%,-50%)';
        answerBox.classList.remove('hidden');
      });
  }

  pickLayer.addEventListener('mousedown', e => {
    if (!picking) return;
    pickStart = { x: e.clientX, y: e.clientY };
    pickRect.style.display = 'block';
    pickRect.style.left = e.clientX + 'px'; pickRect.style.top = e.clientY + 'px';
    pickRect.style.width = '0px'; pickRect.style.height = '0px';
  });
  window.addEventListener('mousemove', e => {
    if (!picking || !pickStart) return;
    const x = Math.min(e.clientX, pickStart.x), y = Math.min(e.clientY, pickStart.y);
    pickRect.style.left = x + 'px'; pickRect.style.top = y + 'px';
    pickRect.style.width = Math.abs(e.clientX - pickStart.x) + 'px';
    pickRect.style.height = Math.abs(e.clientY - pickStart.y) + 'px';
  });
  window.addEventListener('mouseup', e => {
    if (!picking || !pickStart) return;
    const sx0 = pickStart.x, sy0 = pickStart.y;
    const w = Math.abs(e.clientX - sx0), h = Math.abs(e.clientY - sy0);
    pickStart = null;
    if (w < 12 || h < 12) return;                  // 太小：不当作选择，保持框选态让用户重拖（不再误关）
    picking = false;
    pickLayer.classList.add('hidden'); pickRect.style.display = 'none';
    // 把框选区域从截屏裁出 → 缩到 ≤1024 → 转 JPG，发给智谱（网页版发的是演示图，返回模拟文字）
    const natW = pickImg.naturalWidth, natH = pickImg.naturalHeight;
    const k = natW / window.innerWidth, ky = natH / window.innerHeight;
    const X = Math.min(sx0, e.clientX) * k, Y = Math.min(sy0, e.clientY) * ky;
    const RW = w * k, RH = h * ky;
    const scale = Math.min(1, 1024 / Math.max(RW, RH));
    const c = document.createElement('canvas');
    c.width = Math.max(1, Math.round(RW * scale)); c.height = Math.max(1, Math.round(RH * scale));
    c.getContext('2d').drawImage(pickImg, X, Y, RW, RH, 0, 0, c.width, c.height);
    lastRegionB64 = c.toDataURL('image/jpeg', 0.85);
    closeAllPick();                                // 退出全屏，回小窗显示结果
    runGlm(currentAct, lastRegionB64);
  });
  // Esc 取消框选（不想框了就按 Esc）
  window.addEventListener('keydown', e => {
    if (e.key === 'Escape' && picking) closeAllPick();
  });

  function runGlm(act, imgB64) {
    const prompt = act === 'search'
      ? '这是一道题目或问题（可能是文字题、公式、代码或报错截图）。请仔细看图，给出准确的解答步骤和最终答案；若是代码报错，请指出原因并给出修复方案。用中文、条理清晰地回答。'
      : '请看这张屏幕截图，简要描述你看到的内容：用户大概在做什么、界面上有哪些关键信息（文字、报错、数据、窗口标题等）。用中文简要说明。';
    const box = act === 'search' ? answerBox : screenBox;
    const txt = act === 'search' ? answerText : screenText;
    txt.innerHTML = '🤔 小火正在看…';
    box.style.left = '50%'; box.style.top = '40%';
    box.style.transform = 'translate(-50%,-50%)';
    box.classList.remove('hidden');
    // Tauri v2 默认把 Rust 的 snake_case 参数转成 camelCase 暴露给前端，
    // 所以这里必须写 imageB64（写 image_b64 会报 missing required key imageB64）
    invoke('ask_glm', { imageB64: imgB64, prompt })
      .then(res => { txt.innerHTML = res.replace(/\n/g, '<br>'); })
      .catch(err => { txt.innerHTML = '调用失败：' + (err && err.message ? err.message : err); });
  }

  document.querySelector('[data-act="search"]').addEventListener('click', () => startPick('search'));
  answerBox.querySelector('.close').addEventListener('click', () => answerBox.classList.add('hidden'));

  // ---------- 看屏结果框（看屏/搜题共用结果） ----------
  const screenBox = document.getElementById('screenBox');
  const screenText = document.getElementById('screenText');
  document.querySelector('[data-act="screen"]').addEventListener('click', () => startPick('screen'));

  screenBox.querySelectorAll('.actions button').forEach(b => b.addEventListener('click', () => {
    if (b.dataset.s === 'check') {
      screenBox.classList.add('hidden');
      if (lastRegionB64) runGlm('search', lastRegionB64);   // 看屏后顺手查
    } else screenBox.classList.add('hidden');
  }));
  screenBox.querySelector('.close').addEventListener('click', () => screenBox.classList.add('hidden'));

  // ---------- 念念有词（mock 嘴型） ----------
  document.querySelector('[data-act="speak"]').addEventListener('click', () => {
    speakingUntil = performance.now() + 3500;
  });

  // ---------- 网页版动作控制面板（仅演示用，方便查看各种动作） ----------
  const ctrl = document.getElementById('ctrl');
  ctrl.querySelectorAll('button').forEach(b => b.addEventListener('click', () => {
    const s = b.dataset.s;
    if (s === 'poke') { pokeAt(posX, posY); }
    else if (s === 'sing') { setState('sing', autoDuration('sing')); }
    else if (s === 'paint') openPaintInput();
    else { setState(s, autoDuration(s)); }
  }));
})();
</script>
</body>
</html>
